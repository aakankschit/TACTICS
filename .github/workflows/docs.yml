name: Build and Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, streamline/v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Install package with docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build HTML (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs/source docs/build/html

      - name: Verify .nojekyll
        run: test -f docs/build/html/.nojekyll

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          force_orphan: true
          commit_message: "Deploy documentation from ${{ github.sha }}"

  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Check links
        run: python -m sphinx -b linkcheck docs/source docs/build/linkcheck
